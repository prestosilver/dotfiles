shadow = true;
shadow-radius = 1;
shadow-offset-x = 10;
shadow-offset-y = 10;
shadow-opacity = 1;

corner-radius = 0;
round-borders = 20;
rounded-corners-exclude = [
  "class_i = 'budwm'",
  "window_type = 'tooltip'",
  "window_type = 'dock'",
  "_IS_GAPPED@:32c = 1 && _IS_FLOATING@:32c = 0",
  "_XEMBED_INFO@:32c = 1",
];
shadow-exclude = [
  "class_g = 'budwm'",
  "window_type = 'dock'",
  "_IS_GAPPED@:32c = 1 && _IS_FLOATING@:32c = 0",
  "_XEMBED_INFO@:32c = 1",
];

backend = "glx";
vsync = true;
glx-copy-from-front = true;
experimental-backend = true;

fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# --- Geometry & Global Animation Settings ---
animations = false;

# Lower stiffness and higher dampening makes tag transitions smooth, not jerky
animation-stiffness = 240.0;
animation-dampening = 26.0;
animation-clamping = true;

# --- The "Tag Switch" Fix ---
# "slide-left" or "slide-in" creates an organic workspace-sliding illusion 
# when windows map onto the screen during a tag switch.
animation-for-open-window = "zoom"; 
animation-for-unmap-window = "zoom"; 
animation-for-transient-window = "zoom";
animation-for-fullscreen-window = "zoom";
